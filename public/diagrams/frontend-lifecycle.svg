<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" width="1000" height="408" role="img" aria-labelledby="title desc">
  <title id="title">The lifecycle of a front end</title>
  <desc id="desc">The host sends initialize to the front end, which answers with a result. The front end sends run, such as id 1; the host sends many event notifications, and the result when the run ends. More runs follow. Finally the front end closes the connection.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .head { font-size: 15px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .step { font-size: 13px; }
    .sub, .small, .label { font-size: 12px; fill: #59636e; }
    .card { fill: #ffffff; stroke: #d0d7de; }
    .front { fill: #ddf4ff; stroke: #0969da; }
    .front-ink { fill: #0969da; }
    .prov { fill: #fff1e5; stroke: #bc4c00; }
    .prov-ink { fill: #bc4c00; }
    .host { fill: #f6f8fa; stroke: #8c959f; }
    .loop { fill: #ffffff; stroke: #d0d7de; }
    .chip { fill: #eaeef2; }
    .wire { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .tip { fill: #59636e; }
    .life { stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .notify { stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .sub, .small, .label { fill: #9198a1; }
      .card { fill: #0d1117; stroke: #30363d; }
      .front { fill: #0c2d6b; stroke: #4493f8; }
      .front-ink { fill: #4493f8; }
      .prov { fill: #3d1d00; stroke: #f0883e; }
      .prov-ink { fill: #f0883e; }
      .host { fill: #161b22; stroke: #6e7681; }
      .loop { fill: #0d1117; stroke: #30363d; }
      .chip { fill: #262c36; }
      .wire { stroke: #9198a1; }
      .tip { fill: #9198a1; }
      .life { stroke: #30363d; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="tip"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="999" height="407" rx="16"/>

  <rect class="front" x="120" y="24" width="160" height="40" rx="10"/>
  <text class="name front-ink" x="200" y="49" text-anchor="middle">front end</text>
  <line class="life" x1="200" y1="64" x2="200" y2="380"/>
  <rect class="host" x="560" y="24" width="160" height="40" rx="10"/>
  <text class="name " x="640" y="49" text-anchor="middle">host</text>
  <line class="life" x1="640" y1="64" x2="640" y2="380"/>

  <line class="wire" x1="638" y1="104" x2="202" y2="104" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="96" text-anchor="middle">initialize</text>
  <line class="wire" x1="202" y1="144" x2="638" y2="144" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="136" text-anchor="middle">result</text>
  <line class="wire" x1="202" y1="184" x2="638" y2="184" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="176" text-anchor="middle">run (id 1)</text>
  <line class="wire notify" x1="638" y1="224" x2="202" y2="224" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="216" text-anchor="middle">event (notification)</text>
  <text class="small" x="664" y="228">many</text>
  <line class="wire" x1="638" y1="264" x2="202" y2="264" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="256" text-anchor="middle">result</text>
  <text class="small" x="664" y="268">when the run ends</text>
  <text class="small" x="420" y="308" text-anchor="middle">… more runs …</text>
  <line class="wire" x1="202" y1="344" x2="638" y2="344" marker-end="url(#arrow)"/>
  <text class="step mono" x="420" y="336" text-anchor="middle">(closes the connection)</text>

  <text class="small" x="80" y="396">Dashed: a notification, which has no answer.</text>
</svg>
