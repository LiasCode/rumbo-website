<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">rumbo — A small core. An open system.</title>
  <desc id="desc">The first page of the rumbo manual on continuous paper: its name, its synopsis, and the host with the three protocols above it.</desc>
  <defs>
    <pattern id="holes" x="60" width="40" height="38" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="19" r="7" fill="#cfc9bb"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#cfc9bb"/>
  <rect x="60" width="1080" height="630" fill="#f8f5ec"/>
  <rect x="60" width="40" height="630" fill="url(#holes)"/>
  <rect x="1100" width="40" height="630" fill="url(#holes)"/>
  <g stroke="#bdb7a8" stroke-dasharray="4 4">
    <path d="M100.5 0V630M1099.5 0V630"/>
  </g>

  <g font-family="FreeMono" fill="#1c1c1a">
