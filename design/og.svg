    <text x="198" y="466" font-size="22"><tspan font-weight="bold">rumbo</tspan> [<tspan text-decoration="underline">flags</tspan>] [<tspan text-decoration="underline">objective</tspan>]</text>
    <text x="198" y="500" font-size="22"><tspan font-weight="bold">rumbo serve</tspan> [<tspan text-decoration="underline">flags</tspan>]</text>
    <text x="198" y="534" font-size="22"><tspan font-weight="bold">rumbo plugin add</tspan> <tspan text-decoration="underline">source</tspan></text>

