    <text x="196" y="248" font-size="104" font-weight="bold" letter-spacing="-6">rumbo</text>
    <text x="198" y="302" font-size="25">A minimal agent harness.</text>
    <text x="198" y="340" font-size="25" font-weight="bold">A small core. An open system.</text>

    <text x="140" y="420" font-size="21" font-weight="bold">SYNOPSIS</text>
